AWSTemplateFormatVersion: "2010-09-09"
Description: litellm 1.82.8 supply chain attack - environment scanner

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address to receive scan results
    Default: ""

Conditions:
  HasEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:

  SnsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: CMK for litellm scanner SNS topic
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: RootAccess
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action: kms:*
            Resource: "*"
          - Sid: AllowSNS
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: "*"

  SnsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/litellm-scanner-sns-${AWS::StackName}"
      TargetKeyId: !Ref SnsKey

  ScanResultsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: litellm-scan-results
      KmsMasterKeyId: !Ref SnsKey

  ScanResultsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref ScanResultsTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  ScannerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: litellm-scanner-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: litellm-scanner-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LambdaRead
                Effect: Allow
                Action:
                  - lambda:ListFunctions
                  - lambda:GetLayerVersion
                Resource: "*"
              - Sid: ECRRead
                Effect: Allow
                Action:
                  - ecr:DescribeRepositories
                  - ecr:DescribeImages
                Resource: "*"
              - Sid: ECSRead
                Effect: Allow
                Action:
                  - ecs:ListTaskDefinitions
                  - ecs:DescribeTaskDefinition
                Resource: "*"
              - Sid: CodeBuildRead
                Effect: Allow
                Action:
                  - codebuild:ListProjects
                  - codebuild:BatchGetProjects
                Resource: "*"
              - Sid: EC2Read
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                Resource: "*"
              - Sid: SSMRunCommand
                Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                Resource: "*"
              - Sid: CloudTrailRead
                Effect: Allow
                Action:
                  - cloudtrail:LookupEvents
                Resource: "*"
              - Sid: GuardDutyRead
                Effect: Allow
                Action:
                  - guardduty:ListDetectors
                  - guardduty:ListFindings
                  - guardduty:GetFindings
                Resource: "*"
              - Sid: SNSPublish
                Effect: Allow
                Action:
                  - sns:Publish
                Resource: !Ref ScanResultsTopic
              - Sid: SNSKeyAccess
                Effect: Allow
                Action:
                  - kms:GenerateDataKey
                  - kms:Decrypt
                Resource: !GetAtt SnsKey.Arn

  ScannerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: litellm-environment-scanner
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ScannerRole.Arn
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref ScanResultsTopic
      Code:
        ZipFile: |
          import json
          import boto3
          import logging
          import os
          from datetime import datetime, timezone
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          COMPROMISE_DATE = datetime(2026, 3, 24, tzinfo=timezone.utc)
          MALICIOUS_VERSION = "1.82.8"
          MALICIOUS_FILE = "litellm_init.pth"

          findings = []

          def add_finding(service, resource, severity, detail):
              findings.append({"service": service, "resource": resource, "severity": severity, "detail": detail})
              logger.warning(f"[{severity}] {service} | {resource} | {detail}")

          def check_lambda():
              client = boto3.client("lambda")
              paginator = client.get_paginator("list_functions")
              for page in paginator.paginate():
                  for fn in page["Functions"]:
                      name = fn["FunctionName"]
                      env_vars = fn.get("Environment", {}).get("Variables", {})
                      for k, v in env_vars.items():
                          if "litellm" in v.lower() and MALICIOUS_VERSION in v:
                              add_finding("Lambda", name, "HIGH", f"Env var {k} references litellm {MALICIOUS_VERSION}")
                      image = fn.get("PackageType") == "Image" and fn.get("Code", {}).get("ImageUri", "")
                      if image and "litellm" in image.lower():
                          add_finding("Lambda", name, "MEDIUM", f"Container image references litellm: {image}")
                      for layer in fn.get("Layers", []):
                          arn = layer["Arn"]
                          try:
                              parts = arn.split(":")
                              layer_info = client.get_layer_version(LayerName=":".join(parts[:-1]), VersionNumber=int(parts[-1]))
                              if "litellm" in layer_info.get("Description", "").lower():
                                  add_finding("Lambda", name, "HIGH", f"Layer {arn} references litellm")
                          except ClientError:
                              pass

          def check_ecr():
              ecr = boto3.client("ecr")
              try:
                  repos = ecr.describe_repositories()["repositories"]
              except ClientError as e:
                  logger.error(f"ECR error: {e}")
                  return
              for repo in repos:
                  repo_name = repo["repositoryName"]
                  try:
                      images = ecr.describe_images(repositoryName=repo_name)["imageDetails"]
                      for image in images:
                          for tag in image.get("imageTags", []):
                              if "litellm" in tag.lower():
                                  add_finding("ECR", f"{repo_name}:{tag}", "MEDIUM", "Image tag references litellm — inspect for litellm_init.pth")
                          pushed_at = image.get("imagePushedAt")
                          if pushed_at and pushed_at.replace(tzinfo=timezone.utc) >= COMPROMISE_DATE:
                              digest = image.get("imageDigest", "unknown")[:20]
                              add_finding("ECR", f"{repo_name}@{digest}", "INFO", f"Image pushed after {COMPROMISE_DATE.date()} — verify litellm not included")
                  except ClientError as e:
                      logger.error(f"ECR error for {repo_name}: {e}")

          def check_ecs():
              ecs = boto3.client("ecs")
              paginator = ecs.get_paginator("list_task_definitions")
              for page in paginator.paginate(status="ACTIVE"):
                  for arn in page["taskDefinitionArns"]:
                      try:
                          td = ecs.describe_task_definition(taskDefinition=arn)["taskDefinition"]
                          for container in td.get("containerDefinitions", []):
                              image = container.get("image", "")
                              if "litellm" in image.lower():
                                  add_finding("ECS", arn, "HIGH", f"Container image references litellm: {image}")
                              for e in container.get("environment", []):
                                  if "litellm" in e.get("value", "").lower() and MALICIOUS_VERSION in e.get("value", ""):
                                      add_finding("ECS", arn, "HIGH", f"Env var {e['name']} references litellm {MALICIOUS_VERSION}")
                      except ClientError as e:
                          logger.error(f"ECS error {arn}: {e}")

          def check_codebuild():
              cb = boto3.client("codebuild")
              try:
                  project_names = cb.list_projects()["projects"]
              except ClientError as e:
                  logger.error(f"CodeBuild error: {e}")
                  return
              for i in range(0, len(project_names), 100):
                  projects = cb.batch_get_projects(names=project_names[i:i+100])["projects"]
                  for project in projects:
                      name = project["name"]
                      for env_var in project.get("environment", {}).get("environmentVariables", []):
                          if "litellm" in env_var.get("value", "").lower():
                              add_finding("CodeBuild", name, "HIGH", f"Env var {env_var['name']} references litellm")
                      buildspec = project.get("source", {}).get("buildspec", "")
                      if buildspec and "litellm" in buildspec.lower():
                          severity = "CRITICAL" if MALICIOUS_VERSION in buildspec else "MEDIUM"
                          add_finding("CodeBuild", name, severity, f"Buildspec references litellm {'(MALICIOUS VERSION)' if MALICIOUS_VERSION in buildspec else ''}")

          def check_ssm():
              ssm = boto3.client("ssm")
              ec2 = boto3.client("ec2")
              try:
                  reservations = ec2.describe_instances(Filters=[{"Name": "instance-state-name", "Values": ["running"]}])["Reservations"]
              except ClientError as e:
                  logger.error(f"EC2 error: {e}")
                  return
              instance_ids = [i["InstanceId"] for r in reservations for i in r["Instances"]]
              if not instance_ids:
                  logger.info("No running EC2 instances")
                  return
              try:
                  response = ssm.send_command(
                      InstanceIds=instance_ids[:50],
                      DocumentName="AWS-RunShellScript",
                      Parameters={"commands": [
                          f"find / -name '{MALICIOUS_FILE}' 2>/dev/null && echo 'MALICIOUS_FILE_FOUND' || echo 'clean'",
                          "pip show litellm 2>/dev/null | grep -E 'Version|Location' || echo 'litellm_not_installed'"
                      ]},
                      Comment="litellm malware scan",
                      TimeoutSeconds=60
                  )
                  command_id = response["Command"]["CommandId"]
                  add_finding("EC2/SSM", f"CommandId:{command_id}", "INFO", f"SSM scan dispatched to {len(instance_ids[:50])} instances — check SSM Run Command console for results")
              except ClientError as e:
                  add_finding("EC2/SSM", "all-instances", "INFO", f"SSM scan could not be dispatched: {e}")

          def check_cloudtrail():
              ct = boto3.client("cloudtrail")
              for event_name in ["CreateUser", "CreateAccessKey", "AttachUserPolicy", "AttachRolePolicy", "CreateRole"]:
                  try:
                      response = ct.lookup_events(
                          LookupAttributes=[{"AttributeKey": "EventName", "AttributeValue": event_name}],
                          StartTime=COMPROMISE_DATE,
                          MaxResults=10
                      )
                      for event in response.get("Events", []):
                          detail = json.loads(event.get("CloudTrailEvent", "{}"))
                          source_ip = detail.get("sourceIPAddress", "unknown")
                          user = detail.get("userIdentity", {}).get("arn", "unknown")
                          add_finding("CloudTrail", event_name, "MEDIUM", f"IAM modification after compromise date | user={user} | ip={source_ip} | time={event['EventTime']}")
                  except ClientError as e:
                      logger.error(f"CloudTrail error for {event_name}: {e}")

          def check_guardduty():
              gd = boto3.client("guardduty")
              try:
                  detectors = gd.list_detectors()["DetectorIds"]
              except ClientError as e:
                  add_finding("GuardDuty", "N/A", "INFO", "GuardDuty not accessible or not enabled")
                  return
              if not detectors:
                  add_finding("GuardDuty", "N/A", "INFO", "GuardDuty is not enabled — recommend enabling it")
                  return
              for detector_id in detectors:
                  try:
                      finding_ids = gd.list_findings(
                          DetectorId=detector_id,
                          FindingCriteria={"Criterion": {
                              "type": {"Eq": [
                                  "UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS",
                                  "UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.InsideAWS",
                                  "CredentialAccess:IAMUser/AnomalousBehavior"
                              ]},
                              "updatedAt": {"Gte": int(COMPROMISE_DATE.timestamp() * 1000)}
                          }}
                      )["FindingIds"]
                      if finding_ids:
                          for f in gd.get_findings(DetectorId=detector_id, FindingIds=finding_ids[:50])["Findings"]:
                              add_finding("GuardDuty", f["Id"], "CRITICAL", f"type={f['Type']} | severity={f['Severity']} | title={f['Title']}")
                  except ClientError as e:
                      logger.error(f"GuardDuty error: {e}")

          def handler(event, context):
              global findings
              findings = []
              logger.info("Starting litellm malware environment scan")
              check_lambda()
              check_ecr()
              check_ecs()
              check_codebuild()
              check_ssm()
              check_cloudtrail()
              check_guardduty()
              summary = {
                  "scan_time": datetime.now(timezone.utc).isoformat(),
                  "total_findings": len(findings),
                  "critical": sum(1 for f in findings if f["severity"] == "CRITICAL"),
                  "high": sum(1 for f in findings if f["severity"] == "HIGH"),
                  "medium": sum(1 for f in findings if f["severity"] == "MEDIUM"),
                  "info": sum(1 for f in findings if f["severity"] == "INFO"),
                  "findings": findings
              }
              sns_arn = os.environ.get("SNS_TOPIC_ARN")
              if sns_arn:
                  lines = [
                      f"litellm 1.82.8 Supply Chain Scanner - Single Account Report",
                      f"Scan Time : {summary['scan_time']}",
                      f"",
                      f"FINDINGS SUMMARY",
                      f"  CRITICAL : {summary['critical']}",
                      f"  HIGH     : {summary['high']}",
                      f"  MEDIUM   : {summary['medium']}",
                      f"  INFO     : {summary['info']}",
                      f"  TOTAL    : {summary['total_findings']}",
                      f"",
                  ]
                  if summary['total_findings'] == 0:
                      lines.append("No findings detected. Environment appears clean.")
                  else:
                      lines.append("FINDINGS DETAIL")
                      for f in findings:
                          lines.append(f"  [{f['severity']}] {f['service']} / {f['resource']}")
                          lines.append(f"    {f['detail']}")
                  boto3.client("sns").publish(
                      TopicArn=sns_arn,
                      Subject=f"[litellm Scanner] {summary['critical']} CRITICAL, {summary['high']} HIGH, {summary['medium']} MEDIUM",
                      Message="\n".join(lines)
                  )
              logger.info(f"Scan complete: {json.dumps(summary, default=str)}")
              return summary

  # Invoke immediately on deploy via custom resource
  ScanTriggerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: invoke-scanner
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ScannerFunction.Arn

  ScanTriggerFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ScanTriggerRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3, json
          from urllib.request import urlopen, Request

          def send(event, status, data={}):
              body = json.dumps({"Status": status, "Reason": "", "PhysicalResourceId": "InitialScan", "StackId": event["StackId"], "RequestId": event["RequestId"], "LogicalResourceId": event["LogicalResourceId"], "Data": data}).encode()
              req = Request(event["ResponseURL"], data=body, headers={"Content-Type": "", "Content-Length": len(body)}, method="PUT")
              urlopen(req, timeout=10)

          def handler(event, context):
              if event["RequestType"] == "Delete":
                  send(event, "SUCCESS")
                  return
              try:
                  boto3.client("lambda").invoke(FunctionName=event["ResourceProperties"]["FunctionName"], InvocationType="Event")
                  send(event, "SUCCESS")
              except Exception as e:
                  send(event, "FAILED", {"Error": str(e)})

  InitialScan:
    Type: AWS::CloudFormation::CustomResource
    DependsOn: ScannerFunction
    Properties:
      ServiceToken: !GetAtt ScanTriggerFunction.Arn
      FunctionName: !Ref ScannerFunction

  # Optional: schedule daily re-scans
  ScanSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Daily litellm scanner run
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Arn: !GetAtt ScannerFunction.Arn
          Id: litellm-scanner

  ScanSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScannerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScanSchedule.Arn

Outputs:
  ScannerFunctionName:
    Value: !Ref ScannerFunction
    Description: Invoke this function to run a scan manually

  ScanResultsTopicArn:
    Value: !Ref ScanResultsTopic
    Description: SNS topic receiving scan results

  ManualInvokeCommand:
    Value: !Sub "aws lambda invoke --function-name ${ScannerFunction} --payload '{}' scan_results.json && cat scan_results.json"
    Description: CLI command to run the scanner manually
