AWSTemplateFormatVersion: "2010-09-09"
Description: litellm 1.82.8 Supply Chain Scanner - AWS Organizations (Management Account)

# Deploy this template in the MANAGEMENT account only.
# It creates:
#   1. A central S3 bucket to receive scan results from all member accounts
#   2. A StackSet that deploys the member account scanner to every account in the org
#   3. An aggregator Lambda in the management account that consolidates all results
#   4. An SNS topic for consolidated notifications

Parameters:
  NotificationEmail:
    Type: String
    Description: Email address to receive consolidated scan results (optional)
    Default: ""
  OrganizationId:
    Type: String
    Description: AWS Organizations ID (e.g. o-xxxxxxxxxx)
  DeploymentRegions:
    Type: CommaDelimitedList
    Description: Regions to deploy the member scanner into
    Default: "us-east-1"

Conditions:
  HasEmail: !Not [!Equals [!Ref NotificationEmail, ""]]

Resources:

  # -------------------------------------------------------
  # Central results bucket — all member accounts write here
  # -------------------------------------------------------
  CentralResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "litellm-scan-results-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldScans
            Status: Enabled
            ExpirationInDays: 90

  CentralResultsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CentralResultsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowOrgMemberWrites
            Effect: Allow
            Principal: "*"
            Action: s3:PutObject
            Resource: !Sub "${CentralResultsBucket.Arn}/scans/*"
            Condition:
              StringEquals:
                aws:PrincipalOrgID: !Ref OrganizationId
              StringLike:
                s3:prefix: "scans/*"

  # -------------------------------------------------------
  # SNS for consolidated notifications
  # -------------------------------------------------------
  ConsolidatedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: litellm-scan-consolidated

  ConsolidatedSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasEmail
    Properties:
      TopicArn: !Ref ConsolidatedTopic
      Protocol: email
      Endpoint: !Ref NotificationEmail

  # -------------------------------------------------------
  # Aggregator Lambda — runs in management account,
  # reads all member results from S3 and publishes summary
  # -------------------------------------------------------
  AggregatorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "litellm-aggregator-${AWS::StackName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: aggregator-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt CentralResultsBucket.Arn
                  - !Sub "${CentralResultsBucket.Arn}/*"
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref ConsolidatedTopic
              - Effect: Allow
                Action: organizations:ListAccounts
                Resource: "*"

  AggregatorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "litellm-aggregator-${AWS::StackName}"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AggregatorRole.Arn
      Timeout: 300
      MemorySize: 256
      Environment:
        Variables:
          RESULTS_BUCKET: !Ref CentralResultsBucket
          SNS_TOPIC_ARN: !Ref ConsolidatedTopic
      Code:
        ZipFile: |
          import json, boto3, logging, os
          from datetime import datetime, timezone, timedelta

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          def handler(event, context):
              s3 = boto3.client("s3")
              bucket = os.environ["RESULTS_BUCKET"]
              sns_arn = os.environ.get("SNS_TOPIC_ARN")

              # List all scan results from the last 2 days
              cutoff = datetime.now(timezone.utc) - timedelta(days=2)
              paginator = s3.get_paginator("list_objects_v2")
              all_findings = []
              accounts_scanned = []

              for page in paginator.paginate(Bucket=bucket, Prefix="scans/"):
                  for obj in page.get("Contents", []):
                      if obj["LastModified"].replace(tzinfo=timezone.utc) < cutoff:
                          continue
                      try:
                          body = s3.get_object(Bucket=bucket, Key=obj["Key"])["Body"].read()
                          result = json.loads(body)
                          all_findings.extend(result.get("findings", []))
                          accounts_scanned.append(result.get("account", obj["Key"]))
                      except Exception as e:
                          logger.error(f"Error reading {obj['Key']}: {e}")

              summary = {
                  "aggregation_time": datetime.now(timezone.utc).isoformat(),
                  "accounts_scanned": accounts_scanned,
                  "total_accounts": len(accounts_scanned),
                  "total_findings": len(all_findings),
                  "critical": sum(1 for f in all_findings if f["severity"] == "CRITICAL"),
                  "high": sum(1 for f in all_findings if f["severity"] == "HIGH"),
                  "medium": sum(1 for f in all_findings if f["severity"] == "MEDIUM"),
                  "info": sum(1 for f in all_findings if f["severity"] == "INFO"),
                  "findings_by_account": {},
                  "findings": all_findings
              }

              for f in all_findings:
                  acct = f.get("account", "unknown")
                  summary["findings_by_account"].setdefault(acct, []).append(f)

              # Write consolidated result
              s3.put_object(
                  Bucket=bucket,
                  Key=f"consolidated/{datetime.now(timezone.utc).strftime('%Y/%m/%d')}/summary.json",
                  Body=json.dumps(summary, default=str),
                  ContentType="application/json"
              )

              if sns_arn and (summary["critical"] > 0 or summary["high"] > 0):
                  boto3.client("sns").publish(
                      TopicArn=sns_arn,
                      Subject=f"[ORG SCAN] litellm: {summary['critical']} CRITICAL, {summary['high']} HIGH across {summary['total_accounts']} accounts",
                      Message=json.dumps(summary, indent=2, default=str)
                  )

              logger.info(json.dumps(summary, default=str))
              return summary

  AggregatorSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Daily aggregation of litellm scan results across org
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Targets:
        - Arn: !GetAtt AggregatorFunction.Arn
          Id: litellm-aggregator

  AggregatorSchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AggregatorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AggregatorSchedule.Arn

  # -------------------------------------------------------
  # StackSet — deploys member scanner to all org accounts
  # -------------------------------------------------------
  MemberScannerStackSet:
    Type: AWS::CloudFormation::StackSet
    Properties:
      StackSetName: litellm-member-scanner
      Description: Deploys litellm supply chain scanner to all org member accounts
      PermissionModel: SERVICE_MANAGED
      AutoDeployment:
        Enabled: true
        RetainStacksOnAccountRemoval: false
      Capabilities:
        - CAPABILITY_NAMED_IAM
      Parameters:
        - ParameterKey: CentralResultsBucket
          ParameterValue: !Ref CentralResultsBucket
        - ParameterKey: ManagementAccountId
          ParameterValue: !Ref AWS::AccountId
      StackInstancesGroup:
        - DeploymentTargets:
            OrganizationalUnitIds:
              - !Ref OrganizationId
          Regions: !Ref DeploymentRegions
      OperationPreferences:
        FailureTolerancePercentage: 50
        MaxConcurrentPercentage: 25
      ManagedExecution:
        Active: true
      TemplateBody: |
        AWSTemplateFormatVersion: "2010-09-09"
        Description: litellm 1.82.8 Supply Chain Scanner - Member Account

        Parameters:
          CentralResultsBucket:
            Type: String
          ManagementAccountId:
            Type: String

        Resources:

          ScannerRole:
            Type: AWS::IAM::Role
            Properties:
              RoleName: litellm-member-scanner
              AssumeRolePolicyDocument:
                Version: "2012-10-17"
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: lambda.amazonaws.com
                    Action: sts:AssumeRole
              ManagedPolicyArns:
                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              Policies:
                - PolicyName: scanner-policy
                  PolicyDocument:
                    Version: "2012-10-17"
                    Statement:
                      - Sid: ReadOnly
                        Effect: Allow
                        Action:
                          - lambda:ListFunctions
                          - lambda:GetLayerVersionByArn
                          - ecr:DescribeRepositories
                          - ecr:DescribeImages
                          - ecs:ListTaskDefinitions
                          - ecs:DescribeTaskDefinition
                          - codebuild:ListProjects
                          - codebuild:BatchGetProjects
                          - ec2:DescribeInstances
                          - ssm:SendCommand
                          - ssm:GetCommandInvocation
                          - cloudtrail:LookupEvents
                          - guardduty:ListDetectors
                          - guardduty:ListFindings
                          - guardduty:GetFindings
                        Resource: "*"
                      - Sid: WriteResultsToCentral
                        Effect: Allow
                        Action: s3:PutObject
                        Resource: !Sub "arn:aws:s3:::${CentralResultsBucket}/scans/*"

          ScannerFunction:
            Type: AWS::Lambda::Function
            Properties:
              FunctionName: litellm-member-scanner
              Runtime: python3.12
              Handler: index.handler
              Role: !GetAtt ScannerRole.Arn
              Timeout: 300
              MemorySize: 256
              Environment:
                Variables:
                  CENTRAL_BUCKET: !Ref CentralResultsBucket
                  ACCOUNT_ID: !Ref AWS::AccountId
              Code:
                ZipFile: |
                  import json, boto3, logging, os
                  from datetime import datetime, timezone
                  from botocore.exceptions import ClientError

                  logger = logging.getLogger()
                  logger.setLevel(logging.INFO)

                  COMPROMISE_DATE = datetime(2026, 3, 24, tzinfo=timezone.utc)
                  MALICIOUS_VERSION = "1.82.8"
                  MALICIOUS_FILE = "litellm_init.pth"

                  def handler(event, context):
                      account_id = os.environ["ACCOUNT_ID"]
                      findings = []

                      def add(service, resource, severity, detail):
                          findings.append({"account": account_id, "service": service, "resource": resource, "severity": severity, "detail": detail})

                      # Lambda
                      try:
                          client = boto3.client("lambda")
                          for page in client.get_paginator("list_functions").paginate():
                              for fn in page["Functions"]:
                                  name = fn["FunctionName"]
                                  for k, v in fn.get("Environment", {}).get("Variables", {}).items():
                                      if "litellm" in v.lower() and MALICIOUS_VERSION in v:
                                          add("Lambda", name, "HIGH", f"Env var {k} references litellm {MALICIOUS_VERSION}")
                                  image = fn.get("PackageType") == "Image" and fn.get("Code", {}).get("ImageUri", "")
                                  if image and "litellm" in image.lower():
                                      add("Lambda", name, "MEDIUM", f"Container image references litellm: {image}")
                      except ClientError as e:
                          logger.error(f"Lambda: {e}")

                      # ECR
                      try:
                          ecr = boto3.client("ecr")
                          for repo in ecr.describe_repositories()["repositories"]:
                              rname = repo["repositoryName"]
                              for image in ecr.describe_images(repositoryName=rname)["imageDetails"]:
                                  for tag in image.get("imageTags", []):
                                      if "litellm" in tag.lower():
                                          add("ECR", f"{rname}:{tag}", "MEDIUM", "Image tag references litellm")
                                  pushed = image.get("imagePushedAt")
                                  if pushed and pushed.replace(tzinfo=timezone.utc) >= COMPROMISE_DATE:
                                      add("ECR", f"{rname}@{image.get('imageDigest','')[:20]}", "INFO", f"Image pushed after {COMPROMISE_DATE.date()}")
                      except ClientError as e:
                          logger.error(f"ECR: {e}")

                      # ECS
                      try:
                          ecs = boto3.client("ecs")
                          for page in ecs.get_paginator("list_task_definitions").paginate(status="ACTIVE"):
                              for arn in page["taskDefinitionArns"]:
                                  try:
                                      td = ecs.describe_task_definition(taskDefinition=arn)["taskDefinition"]
                                      for c in td.get("containerDefinitions", []):
                                          if "litellm" in c.get("image", "").lower():
                                              add("ECS", arn, "HIGH", f"Container image: {c['image']}")
                                  except ClientError:
                                      pass
                      except ClientError as e:
                          logger.error(f"ECS: {e}")

                      # CodeBuild
                      try:
                          cb = boto3.client("codebuild")
                          names = cb.list_projects()["projects"]
                          for i in range(0, len(names), 100):
                              for p in cb.batch_get_projects(names=names[i:i+100])["projects"]:
                                  bs = p.get("source", {}).get("buildspec", "")
                                  if bs and "litellm" in bs.lower():
                                      sev = "CRITICAL" if MALICIOUS_VERSION in bs else "MEDIUM"
                                      add("CodeBuild", p["name"], sev, f"Buildspec references litellm {'(MALICIOUS VERSION)' if MALICIOUS_VERSION in bs else ''}")
                      except ClientError as e:
                          logger.error(f"CodeBuild: {e}")

                      # EC2 via SSM
                      try:
                          ec2 = boto3.client("ec2")
                          ids = [i["InstanceId"] for r in ec2.describe_instances(Filters=[{"Name": "instance-state-name", "Values": ["running"]}])["Reservations"] for i in r["Instances"]]
                          if ids:
                              resp = boto3.client("ssm").send_command(
                                  InstanceIds=ids[:50], DocumentName="AWS-RunShellScript",
                                  Parameters={"commands": [f"find / -name '{MALICIOUS_FILE}' 2>/dev/null || echo clean"]},
                                  Comment="litellm scan", TimeoutSeconds=60
                              )
                              add("EC2/SSM", f"CommandId:{resp['Command']['CommandId']}", "INFO", f"SSM scan dispatched to {len(ids[:50])} instances")
                      except ClientError as e:
                          logger.error(f"SSM: {e}")

                      # CloudTrail
                      try:
                          ct = boto3.client("cloudtrail")
                          for en in ["CreateUser", "CreateAccessKey", "AttachUserPolicy", "CreateRole"]:
                              for ev in ct.lookup_events(LookupAttributes=[{"AttributeKey": "EventName", "AttributeValue": en}], StartTime=COMPROMISE_DATE, MaxResults=5).get("Events", []):
                                  d = json.loads(ev.get("CloudTrailEvent", "{}"))
                                  add("CloudTrail", en, "MEDIUM", f"IAM change | user={d.get('userIdentity',{}).get('arn','?')} | ip={d.get('sourceIPAddress','?')} | time={ev['EventTime']}")
                      except ClientError as e:
                          logger.error(f"CloudTrail: {e}")

                      # GuardDuty
                      try:
                          gd = boto3.client("guardduty")
                          for det in gd.list_detectors()["DetectorIds"]:
                              ids = gd.list_findings(DetectorId=det, FindingCriteria={"Criterion": {
                                  "type": {"Eq": ["UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS", "CredentialAccess:IAMUser/AnomalousBehavior"]},
                                  "updatedAt": {"Gte": int(COMPROMISE_DATE.timestamp() * 1000)}
                              }})["FindingIds"]
                              for f in (gd.get_findings(DetectorId=det, FindingIds=ids[:50])["Findings"] if ids else []):
                                  add("GuardDuty", f["Id"], "CRITICAL", f"type={f['Type']} | severity={f['Severity']}")
                      except ClientError as e:
                          logger.error(f"GuardDuty: {e}")

                      summary = {
                          "scan_time": datetime.now(timezone.utc).isoformat(),
                          "account": account_id,
                          "total_findings": len(findings),
                          "critical": sum(1 for f in findings if f["severity"] == "CRITICAL"),
                          "high": sum(1 for f in findings if f["severity"] == "HIGH"),
                          "medium": sum(1 for f in findings if f["severity"] == "MEDIUM"),
                          "info": sum(1 for f in findings if f["severity"] == "INFO"),
                          "findings": findings
                      }

                      boto3.client("s3").put_object(
                          Bucket=os.environ["CENTRAL_BUCKET"],
                          Key=f"scans/{datetime.now(timezone.utc).strftime('%Y/%m/%d')}/{account_id}.json",
                          Body=json.dumps(summary, default=str),
                          ContentType="application/json"
                      )
                      logger.info(json.dumps(summary, default=str))
                      return summary

          ScanSchedule:
            Type: AWS::Events::Rule
            Properties:
              ScheduleExpression: rate(1 day)
              State: ENABLED
              Targets:
                - Arn: !GetAtt ScannerFunction.Arn
                  Id: litellm-member-scanner

          ScanSchedulePermission:
            Type: AWS::Lambda::Permission
            Properties:
              FunctionName: !Ref ScannerFunction
              Action: lambda:InvokeFunction
              Principal: events.amazonaws.com
              SourceArn: !GetAtt ScanSchedule.Arn

        Outputs:
          ScannerFunctionName:
            Value: !Ref ScannerFunction

Outputs:
  CentralResultsBucket:
    Value: !Ref CentralResultsBucket
    Description: S3 bucket receiving scan results from all member accounts

  AggregatorFunctionName:
    Value: !Ref AggregatorFunction
    Description: Invoke to aggregate results across all accounts

  ConsolidatedTopicArn:
    Value: !Ref ConsolidatedTopic
    Description: SNS topic for consolidated org-wide scan notifications

  ManualAggregateCommand:
    Value: !Sub "aws lambda invoke --function-name ${AggregatorFunction} --payload '{}' aggregated_results.json && type aggregated_results.json"
    Description: CLI command to manually trigger result aggregation
